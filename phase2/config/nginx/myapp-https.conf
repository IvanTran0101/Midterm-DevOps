# phase2/config/nginx/myapp-https.conf
# HTTPS + redirect - use this AFTER installing Let's Encrypt cert

server {
    listen 80;
    listen [::]:80;

    server_name midtermdevops.trananhminh.uk;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name midtermdevops.trananhminh.uk;

    ssl_certificate     /etc/letsencrypt/live/midtermdevops.trananhminh.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/midtermdevops.trananhminh.uk/privkey.pem;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 50M;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }
}